name: selftest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    # ubuntu-latest 替 WSL 把关：有的 AI 工具在 Windows 上调到的是 WSL 里的 bash；不代表支持 Linux
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run gate selftest
        shell: bash
        run: bash scripts/harness-selftest.sh
