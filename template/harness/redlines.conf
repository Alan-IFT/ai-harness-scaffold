# ==============================================================================
# harness/redlines.conf — 质量红线与预算（全项目唯一阈值来源）
# ------------------------------------------------------------------------------
# 铁律：本文件只允许【人类】修改，AI 不得自行修改。
#   任何改动都会改变文件哈希，ai-gate.sh 检测到基线漂移后会阻断门禁推进；
#   必须由人工在交互终端执行 `bash scripts/ai-gate.sh baseline` 重新确认。
# 语法：KEY=VALUE（值含空格必须加双引号）；# 之后为注释；脚本用 source 读取。
# ==============================================================================

# --- 上下文体积预算（scripts/ai-check-bloat.sh 读取） ---
AGENTS_MAX_LINES=120
MEMORY_MAX_LINES=150
ACTIVE_SPECS_LIMIT=3

# --- 验证预算（scripts/ai-verify.sh 读取） ---
# 单次增量验证的秒级预算；超预算只告警不判失败（用于发现"验证正在变慢"）
VERIFY_MAX_SECONDS=120
# 报告中是否保留完整输出；false 时只保留失败片段（节省磁盘与检索噪音）
VERIFY_KEEP_FULL_LOG=true
# 同一目标连续验证失败上限（黄卡）：达到即停下等人，禁止继续硬闯
VERIFY_MAX_ATTEMPTS=3

# --- CR 修复包络（.agents/skills/code-review.md 与 G5 读取） ---
# 同一 feature 的 CR 修复轮次上限：超过即停下转人工，禁止无限自我修复
CR_MAX_ROUNDS=4

# --- 质量阈值（供 CI 与人工 CR 引用；本地脚本只展示、不臆造实现） ---
# 覆盖率下限（%）：本地增量验证不追求它，由 CI 全量跑完后判定
COVERAGE_MIN=80
# 变异测试得分下限（%）：AI 写的测试常 20~40，人写常 60~80，别假装通过
MUTATION_SCORE_MIN=60
# 变异测试只在增量单测上跑：incremental | off（全量变异测试不进 AI 循环）
MUTATION_MODE=incremental

# --- 写操作边界（供 code-review 与人工使用；越界即按"关键问题"处理） ---
ALLOWED_WRITE_DIRS="src/,tests/,docs/specs/active/"
FORBIDDEN_COMMANDS="git push --force,git reset --hard,rm -rf /"
