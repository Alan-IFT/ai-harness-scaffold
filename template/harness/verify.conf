# ai-verify.sh 运行的项目检查：用 `bash -c "$CUSTOM_CHECK"` 执行，$TARGET_FILE 是待验证文件。
# 接入时改成项目真实的一条命令；不配置时 ai-verify 判为「未验证」，g2 过不去。
# 跑测试的命令在零用例时必须失败，否则空跑也算通过；接入时用一个空用例目录实际跑一次确认。示例：
#   CUSTOM_CHECK='npx eslint "$TARGET_FILE" --max-warnings=0'
#   CUSTOM_CHECK='python -m mypy "$TARGET_FILE"'
#   CUSTOM_CHECK='go vet ./...'
